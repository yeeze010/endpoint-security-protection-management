name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  deliverables:
    name: Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project artifacts
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/GIT_GITHUB_VERSION_MANAGEMENT.md
          test -f docs/DEVELOPMENT.md
          test -f docs/REQUIREMENTS_SPEC.md
          test -f docs/SYSTEM_DESIGN.md
          test -f docs/API_SPEC.md
          test -f docs/TEST_PLAN.md
          test -f docs/DEPLOYMENT_GUIDE.md
          test -f docs/ACCEPTANCE_CRITERIA.md
          test -f .github/ISSUE_TEMPLATE/bug_report.md
          test -f .github/ISSUE_TEMPLATE/feature_request.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f deliverables/终端安全防护管理平台_项目交付方案.docx
          test -f deliverables/终端安全防护管理平台_开发排期分工测试用例.xlsx
          test -f diagram/endpoint-security-platform/system-architecture.svg
