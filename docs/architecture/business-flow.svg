<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .small { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="36" y="44" class="title">核心业务流程图</text>
  <g>
    <rect x="420" y="90" width="250" height="56" rx="24" fill="#0f172a"/>
    <rect x="420" y="90" width="250" height="56" rx="24" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="545" y="123" class="label">Agent 安装与注册</text>
  </g>
  <g>
    <rect x="420" y="190" width="250" height="64" rx="8" fill="#0f172a"/>
    <rect x="420" y="190" width="250" height="64" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="545" y="218" class="label">资产与状态采集</text>
    <text x="545" y="238" class="small">补丁 / 病毒 / 外设 / 软件</text>
  </g>
  <g>
    <rect x="420" y="300" width="250" height="64" rx="8" fill="#0f172a"/>
    <rect x="420" y="300" width="250" height="64" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="545" y="328" class="label">风险评分计算</text>
    <text x="545" y="348" class="small">评分 / 等级 / 整改建议</text>
  </g>
  <g transform="translate(545 450)">
    <polygon points="0,-54 76,0 0,54 -76,0" fill="#0f172a"/>
    <polygon points="0,-54 76,0 0,54 -76,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-4" class="label">是否触发告警?</text>
    <text y="16" class="small">阈值 / 规则 / 聚合</text>
  </g>
  <g>
    <rect x="720" y="418" width="230" height="64" rx="8" fill="#0f172a"/>
    <rect x="720" y="418" width="230" height="64" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="835" y="446" class="label">告警派单处置</text>
    <text x="835" y="466" class="small">研判 / 派单 / 复核 / 关闭</text>
  </g>
  <g>
    <rect x="420" y="560" width="250" height="64" rx="8" fill="#0f172a"/>
    <rect x="420" y="560" width="250" height="64" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="545" y="588" class="label">策略生成与下发</text>
    <text x="545" y="608" class="small">审批 / 灰度 / 回滚</text>
  </g>
  <g>
    <rect x="420" y="690" width="250" height="56" rx="24" fill="#0f172a"/>
    <rect x="420" y="690" width="250" height="56" rx="24" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="545" y="724" class="label">报表归档与审计</text>
  </g>
  <line x1="545" y1="146" x2="545" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="254" x2="545" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="364" x2="545" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="621" y1="450" x2="720" y2="450" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="664" y="440" fill="#fb7185" font-size="9">是</text>
  <path d="M835 482 L835 520 L670 592" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="504" x2="545" y2="560" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="558" y="535" fill="#34d399" font-size="9">否/处置完成</text>
  <line x1="545" y1="624" x2="545" y2="690" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
