    <text x="635" y="481" class="small">评分 / 告警 / 工单</text>
  </g>
  <g>
    <rect x="805" y="150" width="155" height="70" rx="8" fill="#0f172a"/>
    <rect x="805" y="150" width="155" height="70" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="882" y="178" class="label">Redis</text>
    <text x="882" y="196" class="small">心跳 / 限流 / 缓存</text>
  </g>
  <g>
    <rect x="805" y="285" width="155" height="70" rx="8" fill="#0f172a"/>
    <rect x="805" y="285" width="155" height="70" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="882" y="313" class="label">PostgreSQL</text>
    <text x="882" y="331" class="small">业务 / 审计 / 报表</text>
  </g>
  <g>
    <rect x="805" y="420" width="155" height="70" rx="8" fill="#0f172a"/>
    <rect x="805" y="420" width="155" height="70" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="882" y="448" class="label">MinIO</text>
    <text x="882" y="466" class="small">证据 / 隔离 / 报表</text>
  </g>
  <g>
    <rect x="1040" y="220" width="160" height="70" rx="8" fill="#0f172a"/>
    <rect x="1040" y="220" width="160" height="70" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1120" y="248" class="label">外部系统</text>
    <text x="1120" y="266" class="small">SIEM / IAM / CMDB</text>
  </g>

  <line x1="240" y1="205" x2="305" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="345" x2="305" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="275" x2="545" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="275" x2="545" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="275" x2="545" y2="365" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="260" x2="805" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="365" x2="805" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="470" x2="805" y2="455" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="320" x2="1040" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
