<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .small { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
      .lane { fill: none; stroke: #fbbf24; stroke-width: 1; stroke-dasharray: 10 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="36" y="44" class="title">计算机终端安全防护管理系统 - 系统架构图</text>
  <text x="36" y="64" class="sub">Management Console / Backend Services / Agent Gateway / PostgreSQL / Redis / MinIO</text>
  <rect x="28" y="92" width="1224" height="570" rx="16" class="lane"/>
  <text x="48" y="118" fill="#fbbf24" font-size="11" font-weight="700">Docker + Nginx + Internal Network</text>

  <g>
    <rect x="70" y="170" width="170" height="70" rx="8" fill="#0f172a"/>
    <rect x="70" y="170" width="170" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="155" y="198" class="label">管理后台</text>
    <text x="155" y="216" class="small">Vue 3 / TypeScript</text>
  </g>
  <g>
    <rect x="70" y="310" width="170" height="70" rx="8" fill="#0f172a"/>
    <rect x="70" y="310" width="170" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="155" y="338" class="label">终端 Agent</text>
    <text x="155" y="356" class="small">心跳 / 事件 / 策略执行</text>
  </g>
  <g>
    <rect x="305" y="240" width="170" height="70" rx="8" fill="#0f172a"/>
    <rect x="305" y="240" width="170" height="70" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="390" y="268" class="label">Nginx / API 网关</text>
    <text x="390" y="286" class="small">HTTPS / 反向代理 / 限流</text>
  </g>
  <g>
    <rect x="545" y="120" width="180" height="70" rx="8" fill="#0f172a"/>
    <rect x="545" y="120" width="180" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="635" y="148" class="label">认证权限服务</text>
    <text x="635" y="166" class="small">RBAC / 数据权限 / MFA</text>
  </g>
  <g>
    <rect x="545" y="225" width="180" height="70" rx="8" fill="#0f172a"/>
    <rect x="545" y="225" width="180" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="635" y="253" class="label">资产与 Agent 服务</text>
    <text x="635" y="271" class="small">注册 / 心跳 / 清单</text>
  </g>
  <g>
    <rect x="545" y="330" width="180" height="70" rx="8" fill="#0f172a"/>
    <rect x="545" y="330" width="180" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="635" y="358" class="label">策略与任务服务</text>
    <text x="635" y="376" class="small">发布 / 灰度 / 回滚</text>
  </g>
  <g>
    <rect x="545" y="435" width="180" height="70" rx="8" fill="#0f172a"/>
    <rect x="545" y="435" width="180" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
